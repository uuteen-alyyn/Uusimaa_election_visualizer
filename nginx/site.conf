# vaalikartta — nginx configuration for the container image.
#
# The site is a single-page app: routes like /kunta/091 exist only in the
# browser's router, so any path that is not a real file must return index.html
# rather than 404. That is what `try_files ... /index.html` does, and it mirrors
# the `try_files {path} /index.html` the Hetzner Caddyfile used.

server {
    listen       8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # A dedicated health route, so the check never depends on the front page's
    # content or status. deploy.sh curls this through Caddy and the container's
    # own HEALTHCHECK probes it locally; both require a 200.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Election data is content-hashed by Vite (assets/index-<hash>.js) or static
    # JSON that only changes when a build republishes it. Cache the fingerprinted
    # assets hard; leave everything else to revalidate.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback. A missing *file* under /data/ should still 404 rather than
    # silently returning the HTML shell — otherwise a fetch for a missing
    # election JSON resolves to index.html and fails later as a confusing parse
    # error instead of an honest 404.
    location /data/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
